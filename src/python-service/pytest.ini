[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore:Using `httpx` with `starlette.testclient`
    # rasterio-internal (affine `*` operator), not our code
    ignore::PendingDeprecationWarning:rasterio.*
