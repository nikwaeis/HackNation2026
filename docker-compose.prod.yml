name: wodoplon-prod

services:
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    # secret file names map to config keys via Program.cs AddKeyPerFile ("__" = ":")
    secrets:
      - source: db_connection
        target: ConnectionStrings__DefaultConnection
      - source: redis_connection
        target: Redis__ConnectionString
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy

  postgres:
    image: postgis/postgis:17-3.5-alpine
    env_file: .env.prod
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10

  # Python FastAPI geo-worker: internal only (no published port); the API reaches it at
  # http://python-service:8000 (appsettings.json). Healthcheck is defined in Dockerfile.prod.
  python-service:
    build:
      context: ./src/python-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  # Polish OSM water for nearest-water lookups and map ditches. Runs on every `up`, waits for the migrations, imports
  # only when the data is missing or older than 30 days, then exits. OSM_IMPORT=off in .env.prod skips it.
  # Refresh now: docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm -e OSM_IMPORT=always osm-import
  osm-import:
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.10.3
    env_file: .env.prod
    environment:
      PGHOST: postgres
      PGPASSWORD_FILE: /run/secrets/db_password
      OSM_IMPORT: ${OSM_IMPORT:-auto}
      OSM_IMPORT_MAX_AGE_DAYS: ${OSM_IMPORT_MAX_AGE_DAYS:-30}
    restart: "no"
    secrets:
      - db_password
    volumes:
      - ./scripts:/scripts:ro
      - osm:/data
    # database name and user come from .env.prod (POSTGRES_DB / POSTGRES_USER), as for the postgres service
    entrypoint: ["sh", "-c", "PGDATABASE=$$POSTGRES_DB PGUSER=$$POSTGRES_USER exec sh /scripts/import-osm-water.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      - api

secrets:
  db_password:
    file: ./secrets/db_password
  db_connection:
    file: ./secrets/db_connection
  redis_password:
    file: ./secrets/redis_password
  redis_connection:
    file: ./secrets/redis_connection

volumes:
  pgdata:
  redisdata:
  osm:
